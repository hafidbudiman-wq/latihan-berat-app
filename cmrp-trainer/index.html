, and resources","Tool brand, uniforms, office size","Equipment age, paint color, staffing roster"],"answer":1,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"Culture, skilled people and resources are interconnected constraints in organizational change.","validation":"reviewed-original","origin_answer":"B","topic":"Culture people resources","gulati":{"chapter":"1, 2, 10","pdf_pages":"43–47; 459–467","subject":"Culture, people, resources","insight":"Hambatan pengembangan M&R meliputi penerimaan perubahan, keterampilan dan perilaku manusia, serta kecukupan waktu, biaya, peralatan dan dukungan manajemen.","basis":"book"}},{"id":"PRED-053","q":"What action MOST helps reduce resistance when implementing an operator-led inspection program?","options":["Involve affected operators early in design and trials","Announce it without discussion","Increase penalties as the only measure","Avoid explaining the benefits"],"answer":0,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"Early employee involvement builds understanding, ownership and relevant practical input.","validation":"reviewed-original","origin_answer":"A","topic":"Resistance to change","gulati":{"chapter":"2","pdf_pages":"72–75","subject":"Employee involvement","insight":"Melibatkan personel terdampak sejak awal, mendengarkan masukan dan memberikan pelatihan mengurangi resistensi lebih mendasar dibanding mengandalkan hadiah.","basis":"book"}},{"id":"PRED-054","q":"Operators understand a new system and want to use it, but they cannot perform the required tasks. Which ADKAR element is the main gap?","options":["Awareness","Reinforcement","Desire","Ability"],"answer":3,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"Ability means demonstrating the capacity to execute the change, not ined specialist PdM skills?","options":["Purely fragmented with no common standards","Zero-maintenance structure","Hybrid","An inventory-only team"],"answer":2,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"A hybrid model blends local ownership/responsiveness with centralized specialization and standards.","validation":"reviewed-original","origin_answer":"C","topic":"Organization design","gulati":{"chapter":"10","pdf_pages":"465–467","subject":"Hybrid M&R organization","insight":"Hybrid menggabungkan kepemilikan/respons lokal dengan standardisasi dan keahlian teknis terpusat seperti CBM dan precision alignment.","basis":"book"}},{"id":"PRED-058","q":"What should come FIRST when developing training for a new condition monitoring team?","options":["Choose training solely by popularity","Assess required competencies against existing skills","Delay training until a failure occurs","Purchase all available courses"],"answer":1,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"Training needs analysis is based on current vs required competency for future work.","validation":"reviewed-original","origin_answer":"B","topic":"Skill gap","gulati":{"chapter":"10","pdf_pages":"450–459","subject":"Competency gap and training","insight":"Rencana training dimulai dari perbedaan antara kompetensi pekerjaan yang diperlukan dan kemampuan yang tersedia saat ini.","basis":"book"}},{"id":"PRED-059","q":"What does the A in a RACI matrix designate?","options":["Always informed","Accountable for the result or decision","All technicians","Automated"],"answer":1,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"Accountable designates the role ultimately answerable for the work or decision; Responsible executes it.","validation":"reviewed-original","origin_answer":"B","topic":"RACI","gulati":{"chapter":"10","pdf_pages":"459–467","subject":"Clear accountability / organization design","insight":"Gulati menekankan integrasi peran dan akuntabilitas dalam organisasi. Akronim RACI merupakan alat praktis tambahan; A berarti Accountable.","basis":"related"}},{"id":"PRED-060","q":"A single vibration specialist is nearing retirement and no backup exists. Which response BEST limits organizational risk?","options":["Wait for retirement","Delete obsolete work histories","Begin mentoring, documented knowledge transfer and backup skill development","Outsource all maintenance immediately"],"answer":2,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"Succession planning preserves critical competency and reduces single-person dependencies.","validation":"reviewed-original","origin_answer":"C","topic":"Succession planning","gulati":{"chapter":"10","pdf_pages":"466–469","subject":"Succession planning","insight":"Pengetahuan spesialis perlu dipindahkan lewat mentoring, dokumentasi, job rotation dan pengembangan pengganti sebelum personel kunci pergi.","basis":"book"}},{"id":"PRED-061","q":"A plant manager praises heroic emergency repairs but never recognizes avoided failures. What culture is reinforced?","options":["Defect prevention","Long-term asset stewardship","Reactive maintenance","Reliability excellence"],"answer":2,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"Recognition and incentives shape behavior; rewarding repair heroics without prevention incentives can sustain reactive culture.","validation":"reviewed-original","origin_answer":"C","topic":"Leadership behaviors","gulati":{"chapter":"2","pdf_pages":"47–61; 75–79","subject":"Leadership and reliability culture","insight":"Budaya dibentuk oleh perilaku yang dihargai pemimpin serta dukungan nyata berupa sumber daya, governance, pelatihan dan penguatan berulang.","basis":"book"}},{"id":"PRED-062","q":"Which M&R goal is most suitable for organizational alignment?","options":["Be the best someday","Make all workers happier without measures","Purchase more sensors without objectives","Reduce high-risk pump failures by 30% within 12 months using an agreed baseline"],"answer":3,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"Specific measurable time-bound outcomes help align strategy and execution; verify a meaningful baseline and feasibility.","validation":"reviewed-original","origin_answer":"D","topic":"Vision and goals","gulati":{"chapter":"2, 10","pdf_pages":"61–72; 459–461","subject":"Vision, goals and cross-functional alignment","insight":"Sasaran reliability harus spesifik, terukur dan selaras dengan sasaran produksi/bisnis, dengan partisipasi lintas fungsi yang terdampak.","basis":"book"}},{"id":"PRED-063","q":"Who should participate in setting high-level reliability targets that affect unit throughput and budget?","options":["Operations, M&R, Engineering and other relevant business functions","Only finance without technical input","Only the parts supplier","Only the maintenance supervisor"],"answer":0,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"M&R objectives require shared ownership across functions affected by risks, operations and resources.","validation":"reviewed-original","origin_answer":"A","topic":"Cross-functional ownership","gulati":{"chapter":"2, 10","pdf_pages":"61–72; 459–461","subject":"Vision, goals and cross-functional alignment","insight":"Sasaran reliability harus spesifik, terukur dan selaras dengan sasaran produksi/bisnis, dengan partisipasi lintas fungsi yang terdampak.","basis":"book"}},{"id":"PRED-064","q":"Which management action most strongly demonstrates sustained support for reliability culture?","options":["Asking reliability to avoid reporting failures","Providing resources, cross-functional governance and repeated review of improvement outcomes","One-off slogan campaign","Changing KPIs without communication"],"answer":1,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"Culture requires sustained resource commitment, engagement, accountability, and learning.","validation":"reviewed-original","origin_answer":"B","topic":"Culture and leadership","gulati":{"chapter":"2","pdf_pages":"47–61; 75–79","subject":"Leadership and reliability culture","insight":"Budaya dibentuk oleh perilaku yang dihargai pemimpin serta dukungan nyata berupa sumber daya, governance, pelatihan dan penguatan berulang.","basis":"book"}},{"id":"PRED-065","q":"A newly formed reliability improvement team is discussing roles and trying to establish norms. Which stage is most likely?","options":["Forming","Adjourning","Performing","Sustaining"],"answer":0,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Organization & Leadership","explanation":"Forming is early orientation and clarifying roles; storming may involve conflict, norming agreements and performing mature collaboration.","validation":"reviewed-original","origin_answer":"A","topic":"Team development","gulati":{"chapter":"10","pdf_pages":"417–470","subject":"Team development","insight":"Gulati membahas people development dan dinamika teamwork; urutan Forming–Storming–Norming–Performing digunakan sebagai model tahap pembentukan tim.","basis":"related"}},{"id":"PRED-066","q":"What is the BEST response when a competent technician makes a first-time procedural error?","options":["Eliminate standard procedures","Terminate the technician without investigation","Hide the event","Assess the process and contributing factors, coach and improve safeguards"],"answer":3,"source":"Predictive BoK — soal orisinal (85)","page":nul and resources","gulati":{"chapter":"2","pdf_pages":"47–61; 75–79","subject":"Leadership and reliability culture","insight":"Budaya dibentuk oleh perilaku yang dihargai pemimpin serta dukungan nyata berupa sumber daya, governance, pelatihan dan penguatan berulang.","basis":"book"}},{"id":"PRED-069","q":"Which statement best distinguishes planning from scheduling?","options":["Planning occurs after job closeout","They are identical","Planning defines how and with what resources; scheduling coordinates when and by whom","Planning is only for finance; scheduling is only for vendors"],"answer":2,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Work Management","explanation":"Planners develop job packages and estimates; schedulers coordinate job timing and capacity.","validation":"reviewed-original","origin_answer":"C","topic":"Planner vs scheduler","gulati":{"chapter":"4","pdf_pages":"135–139; 151–153","subject":"Planning versus scheduling","insight":"Planning menetapkan apa/bagaimana dan sumber daya; scheduling mengatur kapan/siapa dengan mempertimbangkan kesiapan produksi dan kapasitas tenaga kerja.","basis":"book"}},{"id":"PRED-070","q":"A high-quality maintenance job package should include:","options":["Only the planned completion date","Scope, procedures, required skills, tools, parts, permits and estimated hours","Only purchase cost","Only the asset name"],"answer":1,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Work Management","explanation":"Work package completeness reduces delays, safety risk and quality problems.","validation":"reviewed-original","origin_answer":"B","topic":"Job package","gulati":{"chapter":"4","pdf_pages":"135–139; 151–157","subject":"Maintenance work package","insight":"Job package yang baik mencakup instruksi, alat, material, keahlian, permit/safety, dan estimasi durasi untuk menekan delay.","basis":"book"}},{"id":"PRED-071","q":"When two work requests compete for limited manpower, what is the most defensible priority basis?","options":["Risk, criticality, consequence and operational urgency","Technician preference","Who complains the loudest","Work request age only"],"answer":0,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Work Management","explanation":"Work priority should follow an agreed objective risk/criticality system.","validation":"reviewed-original","origin_answer":"A","topic":"Priority system","gulati":{"chapter":"4","pdf_pages":"136–145; 167–169","subject":"Work prioritization","insight":"Work priority harus mempertimbangkan criticality, konsekuensi dan kebutuhan operasi, bukan siapa yang paling keras meminta.","basis":"book"}},{"id":"PRED-072","q":"A department has 1,200 estimated labor-hours of ready backlog and 300 labor-hours of weekly net available capacity. What is backlog in weeks?","options":["0.25 weeks","4 weeks","3 weeks","40 weeks"],"answer":1,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Perhitungan","pillar":"Work Management","explanation":"Backlog weeks = labor-hours of work / available labor-hours per week = 1,200/300=4.","validation":"reviewed-original","origin_answer":"B","topic":"Backlog weeks","gulati":{"chapter":"4","pdf_pages":"141–152","subject":"Backlog management","insight":"Backlog minggu dihitung dari estimated ready work dibanding net available weekly labor capacity; ini indikator kapasitas perencanaan, bukan sekadar jumlah WO.","basis":"book"}},{"id":"PRED-073","q":"A weekly plan contains 40 jobs and 34 are completed as scheduled. What is job-count schedule compliance?","options":["90%","117.6%","85%","34%"],"answer":2,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Perhitungan","pillar":"Work Management","explanation":"34/40*100 = 85%. Some organizations use labor-hours; use the definition in the question.","validation":"reviewed-original","origin_answer":"C","topic":"Schedule compliance","gulati":{"chapter":"4, 9","pdf_pages":"132–170; 393–395","subject":"Compliance metrics","insight":"Schedule/PM compliance adalah indikator eksekusi proses; definisi job-count, hours-weighted atau window compliance harus dipilih secara konsisten.","basis":"book"}},{"id":"PRED-074","q":"A site completed 72 of 80 PM tasks due within the allowed window. What is task-count PM compliance?","options":["80%","72%","8%","90%"],"answer":3,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Perhitungan","pillar":"Work Management","explanation":"72/80 *100 = 90%, with consistent definition of due tasks and compliance window.","validation":"reviewed-original","origin_answer":"D","topic":"PM compliance","gulati":{"chapter":"4, 9","pdf_pages":"132–170; 393–395","subject":"Compliance metrics","insight":"Schedule/PM compliance adalah indikator eksekusi proses; definisi job-count, hours-weighted atau window compliance harus dipilih secara konsisten.","basis":"book"}},{"id":"PRED-075","q":"Craft technicians collectively spend 144 labor-hours doing direct maintenance work out of 360 available labor-hours. What is wrench time?","options":["60%","25%","40%","90%"],"answer":2,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Perhitungan","pillar":"Work Management","explanation":"Wrench time = direct maintenance time / total available craft time = 144/360 = 40%.","validation":"reviewed-original","origin_answer":"C","topic":"Wrench time","gulati":{"chapter":"4","pdf_pages":"132; 152–153; 162","subject":"Wrench time","insight":"Wrench time adalah jam aktivitas maintenance langsung dibanding available craft hours; waiting, travel untuk mencari part dan delay bukan direct work.","basis":"book"}},{"id":"PRED-076","q":"A repair required 3 hours of actual hands-on work but took 14 hours from failure to restart. What should the team investigate?","options":["Only the purchase price of the bearing","Waiting for permits, access, materials and other delays","Whether 3 is greater t r":"3, 4","pdf_pages":"109–116; 136–140; 693–694","subject":"WO documentation","insight":"Asset ID menautkan histori ke equipment yang benar; teknisi mencatat apa yang ditemukan dan dikerjakan, supervisor memeriksa sesuai kontrol site.","basis":"book"}},{"id":"PRED-079","q":"What is the main purpose of material kitting before a planned job?","options":["Avoid job planning","Increase unnecessary inventory","Ensure required parts and materials are staged to reduce execution delays","Replace the work-order history"],"answer":2,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Work Management","explanation":"Kitting makes materials ready before release and supports higher productive wrench time.","validation":"reviewed-original","origin_answer":"C","topic":"Kitting","gulati":{"chapter":"4, 5","pdf_pages":"135–139; 185–196","subject":"Kitting and material readiness","insight":"Menyiapkan work package dan parts sebelum pekerjaan menurunkan gangguan, perjalanan ke storeroom dan waktu menunggu.","basis":"book"}},{"id":"PRED-080","q":"Average spare-part demand is 2 units/day with replenishment lead time 10 days and safety stock 5 units. What is a simple reorder point?","options":["20 units","15 units","50 units","25 units"],"answer":3,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Perhitungan","pillar":"Work Management","explanation":"Reorder point = demand during lead time + safety stock = 2*10+5 = 25 units.","validation":"reviewed-original","origin_answer":"D","topic":"Reorder point","gulati":{"chapter":"5","pdf_pages":"191–199","subject":"Inventory control / reorder point","insight":"Reorder point sederhana menghitung demand selama lead time ditambah safety stock; ini aplikasi prinsip stok untuk mencegah stockout.","basis":"related"}},{"id":"PRED-081","q":"What is the central objective of the classical Economic Order Quantity model?","options":["Make order size equal to annual demand","Minimize failures by replacing all parts","Eliminate all material lead times","Minimize the sum of annual ordering and holding costs"],"answer":3,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Work Management","explanation":"EOQ balances setup/order cost against holding cost given model assumptions.","validation":"reviewed-original","origin_answer":"D","topic":"EOQ","gulati":{"chapter":"5","pdf_pages":"194–197","subject":"Economic order quantity","insight":"EOQ menyeimbangkan biaya pemesanan dan penyimpanan untuk meminimalkan total biaya inventori pada asumsi model klasik.","basis":"book"}},{"id":"PRED-082","q":"In spare-parts inventory, ABC analysis is primarily used to:","options":["Calculate system MTBF","Assess electric motor insulation","Rank parts by annual consumption value to focus controls","Decide equipment criticality solely by purchase date"],"answer":2,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Work Management","explanation":"ABC classifies items by annual usage value; criticality/stockout risk should be considered in addition.","validation":"reviewed-original","origin_answer":"C","topic":"ABC inventory","gulati":{"chapter":"5","pdf_pages":"190–200","subject":"ABC inventory","insight":"ABC analysis memprioritaskan pengendalian persediaan berdasarkan nilai pemakaian tahunan, bukan semata tingkat kekritisan teknis.","basis":"book"}},{"id":"PRED-083","q":"A credible immediate safety threat requires urgent repair. Which work-management approach is BEST?","options":["Insist on full routine weekly planning before any action","Remove permits and safeguards","Wait until spare parts are cheaper","Use an authorized emergency path with risk controls and documented follow-up"],"answer":3,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Work Management","explanation":"Emergency work can bypass some routine scheduling steps but not applicable safety controls, approvals or learning.","validation":"reviewed-original","origin_answer":"D","topic":"Emergency work","gulati":{"chapter":"4","pdf_pages":"136–140; 159–169","subject":"Emergency work path","insight":"Pekerjaan emergency dapat melewati sebagian planning normal tetapi harus menggunakan otorisasi, pengendalian risiko dan pencatatan yang tepat.","basis":"book"}},{"id":"PRED-084","q":"Repeated low-priority break-in work disrupts the weekly maintenance schedule. What is a strong corrective measure?","options":["Allow every new request to displace scheduled jobs","Stop recording break-ins","Establish break-in criteria, priority discipline and a protected schedule","Remove all planners"],"answer":2,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Work Management","explanation":"Formal work screening and schedule governance protect planned work and expose true emergent risks.","validation":"reviewed-original","origin_answer":"C","topic":"Frozen schedule","gulati":{"chapter":"4","pdf_pages":"152–163","subject":"Frozen schedule / break-in control","insight":"Disiplin prioritas dan aturan break-in melindungi jadwal terencana agar pekerjaan mendadak yang tidak kritis tidak menggerus produktivitas.","basis":"book"}},{"id":"PRED-085","q":"After a major repair, how can work-order closeout best contribute to future reliability?","options":["Delete failure history after successful restart","Avoid feedback to the planner","Log only that the equipment was fixed","Record as-found/as-left condition, failure codes, parts, times and lessons for PM/job-plan improvement"],"answer":3,"source":"Predictive BoK — soal orisinal (85)","page":null,"kind":"Skenario","pillar":"Work Management","explanation":"Good closeout data drives root-cause analysis, job plan updates, maintenance strategy revision and accurate metrics.","validation":"reviewed-original","origin_answer":"D","topic":"Continuous improvement","gulati":{"chapter":"4, 11","pdf_pages":"136–140; 548–550","subject":"Work-order feedback and learning","insight":"As-found, as-left, actual parts dan failure codes menghasilkan data untuk RCA, pembaruan PM serta pembelajaran planner.","basis":"book"}}],"flash":[{"id":"GFC-1","pillar":"Business & Management","q":"Leading versus lagging KPI","answer":"Leading: process predictability, e.g. planned work. Lagging: measured result, e.g. MTBF or availability.","explanation":"Gulati Bab 9, PDF 393–395"},{"id":"GFC-2","pillar":"Business & Management","q":"What should a good reliability business case include?","answer":"Risk, avoided production loss, life-cycle cost and time value of money, assumptions and alternatives.","explanation":"Gulati Bab 3, PDF 115–116; Bab 9"},{"id":"GFC-3","pillar":"Manufacturing Process Reliability","q":"OEE formula","answer":"OEE = Availability × Performance × Quality.","explanation":"Gulati Bab 7, PDF 273–289"},{"id":"GFC-4","pillar":"Manufacturing Process Reliability","q":"TEEP formula","answer":"TEEP = Calendar Utilization × OEE.","explanation":"Gulati Bab 7, PDF 273–289"},{"id":"GFC-5","pillar":"Manufacturing Process Reliability","q":"What do SPC control limits reveal?","answer":"Statistical process behavior, not customer specification limits.","explanation":"Gulati Bab 11, PDF 522–525"},{"id":"GFC-6","pillar":"Equipment Reliability","q":"MTBF formula for a repairable asset","answer":"Total operating hours / number of functional failures.","explanation":"Gulati Bab 6, PDF 219–220"},{"id":"GFC-7","pillar":"Equipment Reliability","q":"Inherent availability","answer":"Ai = MTBF / (MTBF + MTTR).","explanation":"Gulati Bab 6, PDF 230–233"},{"id":"GFC-8","pillar":"Equipment Reliability","q":"What does Weibull β>1 mean?","answer":"Increasing hazard rate, often characteristic of aging/wear-out.","explanation":"Gulati Bab 6, PDF 226–230"},{"id":"GFC-9","pillar":"Equipment Reliability","q":"Series and parallel reliability","answer":"Series: product Ri; independent parallel: 1 − product(1−Ri).","explanation":"Gulati Bab 6, PDF 234–239"},{"id":"GFC-10","pillar":"Organization & Leadership","q":"Constraints in developing an M&R organization","answer":"Culture, people and resources.","explanation":"Soal latihan CMRP, didukung oleh Gulati Bab 2 & 10."},{"id":"GFC-11","pillar":"Organization & Leadership","q":"ADKAR","answer":"Awareness, Desire, Knowledge, Ability, Reinforcement.","explanation":"Gulati Bab 2, PDF 72–74"},{"id":"GFC-12","pillar":"Work Management","q":"Planner versus scheduler","answer":"Planner: what/how/resources. Scheduler: when/who/capacity.","explanation":"Gulati Bab 4, PDF 151–153"},{"id":"GFC-13","pillar":"Work Management","q":"Wrench time","answer":"Hands-on labor hours / available craft labor hours × 100%.","explanation":"Gulati Bab 4, PDF 132; 152–153"},{"id":"GFC-14","pillar":"Work Management","q":"Backlog weeks","answer":"Estimated ready-work hours / net available labor hours per week.","explanation":"Gulati Bab 4."}],"metadata":{"practice":148,"mock":134,"flash":151,"ocr_rejected":[["no question",6,"Overall explanation\nStatutory and regulatory compliance, and especially safety-related work, typically receives the\nhigh"],["parse",9,9,"opts=3","pre=0","When a manufacturing process experiences frequent jams or blockages, which analy",["Scatter Plot","Histogram","Control Chart"]],["parse",11,11,"opts=1","pre=1","True/False: One of the goals of Shutdown & Outage is to optimize the use of main",["TRUE"]],["parse",21,21,"opts=1","pre=0","What is the primary role of the operator in maintaining manufacturing process re",["Passive observers of equipment performance"]],["parse",50,50,"opts=2","pre=0","True oF False: \"Scheduling\" is the process of deciding what work will be done, w",["This is from Work Management pillar]","Q TRUE"]],["no question",61,"Practies mode) ©\nOT i Finish test\n| © Correct answer. Good job! Review the explanation and resources to learn more.\n© Qu"],["parse",63,63,"opts=3","pre=0","system is composed of 2 identical independent elements in series <script>
'use strict';
const BANK=JSON.parse(document.getElementById('bank-data').textContent);
const MCQ=BANK.mcq,FLASH=BANK.flash;
const PILLARS=['Business & Management','Manufacturing Process Reliability','Equipment Reliability','Organization & Leadership','Work Management'];

const KEY='smrp-cmrp-trainer-v1';let saved;

const STATE={tab:'home',session:null,questionBank:MCQ,config:{pillar:'all',kind:'all',source:'all',count:'20',scope:'all'},flashFilter:'all',flashIndex:0,flipped:false,search:'',resultReview:'wrong'};
const STORE={history:saved.history||{},bookmarks:saved.bookmarks||[],flags:saved.flags||[],exams:saved.exams||[],mastered:saved.mastered||[]};
try{const old=JSON.parse(localStorage.getItem(KEY+'__active')||'null');if(old&&Array.isArray(old.items)&&old.items.length&&typeof old.deadline==='number'){STATE.session=old;STATE.tab=old.exam?'exam':'study';}}catch(e){}
function persistSession(){try{if(STATE.session)localStorage.setItem(KEY+'__active',JSON.stringify(STATE.session));else localStorage.removeItem(KEY+'__active')}catch(e){}}
const $=s=>document.querySelector(s); const H=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labelKey=q=>q.options[q.answer]??'—';
function save(){try{localStorage.setItem(KEY,JSON.stringify(STORE))}catch(e){}}
function nav(){let items=TABS.map(([id,ic,lab])=>`<button class="navbtn ${STATE.tab===id?'active':''}" data-action="nav" data-tab="${id}"><span class="navico">${ic}</span>${lab}</button>`).join('');$('#sidebar').innerHTML=`<div class="logo"><div class="brandmark">R</div><div class="brand"><strong>SMRP Trainer</strong><small>CMRP • Final Prep V1.3</small></div></div><div>${items}</div><div class="sidebottom">5 pilar • Latihan mandiri<br>Progres tersimpan di perangkat ini. <p class="small" style="margin-top:7px">Sebagian kunci sumber belum diaudit; sebagian kunci sumber masih memerlukan audit.</p></div>`;$('#mobilebar').innerHTML=TABS.map(([id,ic,lab])=>`<button data-action="nav" data-tab="${id}" class="mobbtn ${STATE.tab===id?'on':''}"><span class="mi">${ic}</span>${lab}</button>`).join('')}
function header(k,title,desc){return `<div class="top"><div><div class="eyebrow">${H(k)}</div><h1>${H(title)}</h1>${desc?`<p class="muted">${H(desc)}</p>`:''}</div><div class="topright"><span class="pill">Offline • Tanpa akun</span><span class="pill">SMRP / CMRP</span></div></div>`}
function btn(text,action,cl='',attrs=''){return `<button class="btn ${cl}" data-action="${action}" ${attrs}>${text}</button>`}
function stat(name,v,note=''){return `<div class="stat"><div class="name">${H(name)}</div><div class="value">${H(v)}</div><div class="note">${H(note)}</div></div>`}
function totalAttempts(){return Object.values(STORE.history).reduce((a,b)=>a+b.total,0)}
function statsPillar(p){const rows=Object.keys(STORE.history).filter(id=>{let x=MCQ.find(q=>q.id===id);return x&&x.pillar===p});const seen=rows.length;const answers=rows.reduce((a,id)=>a+STORE.history[id].total,0);const correct=rows.reduce((a,id)=>a+STORE.history[id].correct,0);return {seen,answers,correct,acc:answers?Math.round(100*correct/answers):0}}
function home(){let visited=Object.keys(STORE.history).length;let scores=STORE.exams.map(x=>x.score);return header('Pusat Latihan','CMRP • Gulati Guided Review','110 soal orisinal berbasis cakupan SMRP BoK; pembahasan dipadankan dengan Bab/Halaman PDF Gulati (parafrasa, bukan kutipan).')+`<div class="hero"><div class="eyebrow">Persiapan Sertifikasi</div><h2>Uji kesiapan <span class="accent">5 Pilar SMRP</span> sebelum hari ujian.</h2><p>Mulai dengan Diagnostic 25 soal orisinal, lanjutkan Full Mock 110 orisinal dalam 150 menit. Latihan dirancang dari area kompetensi BoK, bukan prediksi bocoran soal. Hasil dipecah per pilar untuk menentukan fokus belajar.</p><div class="actions">${btn('Diagnostic 25 soal ✓','quickDiagnostic','primary')}${btn('Full Mock 110 ORISINAL','quickFull','')}${btn('Latihan per pilar','nav','subtle','data-tab="study"')}${btn('Kartu rumus','nav','subtle','data-tab="formulas"')}</div></div><div class="grid">${stat('Soal pilihan ganda',MCQ.length,'110 soal orisinal BoK')}${stat('Kartu pengetahuan',FLASH.length,'Termasuk ringkasan rumus')}${stat('Soal pernah dikerjakan',visited,'Tersimpan di perangkat')}${stat('Skor ujian tertinggi',scores.length?Math.max(...scores)+'%':'—','Simulasi pribadi, bukan skor resmi')}</div><div class="twocol blockspace"><div class="section"><div class="sectionhead"><h3>Latihan berdasarkan pilar</h3><span class="pill">5 pilar</span></div><div class="pillars">${PILLARS.map(p=>{let n=MCQ.filter(q=>q.pillar===p).length,st=statsPillar(p);return `<button class="pillar" data-action="choosePillar" data-pillar="${H(p)}"><div class="pname">${H(p)}</div><small>${n} soal • ${st.seen} pernah dijawab</small><div class="bar"><span style="width:${Math.min(100,100*st.seen/n)}%"></span></div></button>`}).join('')}</div></div><div class="section"><div class="sectionhead"><h3>Cara belajar yang tersedia</h3></div><div class="listrow"><span><b>▣ Latihan</b><div class="small muted">Jawaban & pembahasan langsung</div></span>${btn('Buka','nav','subtle','data-tab="study"')}</div><div class="listrow"><span><b>◷ Mock exam</b><div class="small muted">Timer, nilai akhir, review jawaban</div></span>${btn('Buka','nav','subtle','data-tab="exam"')}</div><div class="listrow"><span><b>◇ Kartu hafalan</b><div class="small muted">Balik kartu dan tandai sudah hafal</div></span>${btn('Buka','nav','subtle','data-tab="flash"')}</div><div class="listrow"><span><b>∑ Kalkulator</b><div class="small muted">Availability, OEE, MTBF, MTTR, RPN, EOQ, ROP</div></span>${btn('Buka','nav','subtle','data-tab="formulas"')}</div></div></div><div class="fineprint blockspace"><b>Update V1.3:</b> 25 soal diagnostik berbasis buku Gulati ditambahkan; full mock 110 soal / 150 menit mengikuti durasi ujian CMRP. 95 soal dari Comprehensive CMRP Study Guide sudah ditambahkan. Catatan audit: COMP-14, COMP-39, COMP-72, COMP-79 perlu dibaca saksama.<br><b>Catatan kualitas sumber:</b> kunci dari PDF/screenshot yang belum diaudit ditandai jelas. Dua kesalahan kunci di Practice Exam (EX-4 dan EX-22) sudah dikoreksi berdasarkan konsep; kesalahan contoh OEE bottle filler di kartu rumus juga sudah diperbaiki. Ini materi latihan, bukan soal resmi SMRP.</div>`}
function selectField(id,title,opts){let val=STATE.config[id];return `<div class="field"><label for="${id}">${H(title)}</label><select id="${id}" data-config="${id}">${opts.map(([v,l])=>`<option value="${H(v)}" ${String(val)===String(v)?'selected':''}>${H(l)}</option>`).join('')}</select></div>`}
function setup(exam){let c=STATE.config,p=[['all','Semua pilar'],...PILLARS.map(x=>[x,x])],ty=[['all','Semua tipe'],...['Konsep','Skenario','Pengecualian','Perhitungan','Benar/Salah'].map(x=>[x,x])],so=[['all','Seluruh sumber'],['ONLY-ORIGINAL','Seluruh 110 soal orisinal (BoK)'],['Predictive BoK — soal orisinal (85)','Prediktif 85 soal orisinal (baru)'],['Diagnostic Final — Gulati (25 soal)','Diagnostic 25 orisinal'],['Comprehensive CMRP — 95 Soal (PDF)','Comprehensive CMRP (95 soal baru)']],co=[['10','10 soal'],['20','20 soal'],['25','25 soal'],['50','50 soal'],['100','100 soal'],['110','110 soal (ujian)'],['all','Seluruh soal yang cocok']],sc=[['all','Semua soal'],['wrong','Pernah salah'],['bookmark','Ditandai untuk belajar'],['flag','Kunci yang lo ragukan']];const n=filtered().length;return header(exam?'Simulasi ujian':'Latihan harian',exam?'Atur Mock Exam':'Atur latihan','Pilih pilar, jenis pertanyaan, sumber, dan jumlah soal.')+`<div class="panel" style="max-width:860px"><div class="fieldgrid">${selectField('pillar','Pilar',p)}${selectField('kind','Jenis soal',ty)}${selectField('source','Sumber',so)}${selectField('count','Jumlah soal',co)}${selectField('scope','Fokus belajar',sc)}</div><div class="fineprint blockspace">Ditemukan <b>${n} soal</b> yang sesuai. ${exam?'Dalam mode ujian jawaban dan pembahasan baru muncul di akhir. Untuk 110 soal, timer 150 menit mengikuti durasi resmi; mode lain 75 detik/soal hanya aturan latihan.':'Dalam mode latihan, setiap jawaban langsung mendapat penjelasan. Progres disimpan otomatis.'}</div><div class="actions blockspace">${btn(exam?'Mulai ujian':'Mulai latihan','start', 'primary',`data-exam="${exam?'1':'0'}" ${n?'':'disabled'}`)}${btn('Kembali ke beranda','nav','subtle','data-tab="home"')}</div></div><div class="blockspace"><div class="panel"><h3>Catatan audit bank soal</h3><p class="muted small">Materi sumber memiliki beberapa kunci yang keliru dan halaman screenshot yang terpotong. Pertanyaan screenshot tidak lengkap sudah dikeluarkan dari sesi; kunci yang belum diaudit tetap diberi label <b>Kunci sumber</b>, bukan dianggap pasti benar. Gunakan tombol "Tandai kunci meragukan" jika menemukan ketidaksesuaian.</p></div></div>`}
function filtered(){let c=STATE.config;return MCQ.filter(q=>(c.pillar==='all'||q.pillar===c.pillar)&&(c.kind==='all'||q.kind===c.kind)&&(c.source==='all'||(c.source==='ONLY-ORIGINAL'&&(q.source==='Predictive BoK — soal orisinal (85)'||q.source==='Diagnostic Final — Gulati (25 soal)'))||q.source===c.source)&&(c.scope==='all'||(c.scope==='wrong'&&STORE.history[q.id]?.last===false)||(c.scope==='bookmark'&&STORE.bookmarks.includes(q.id))||(c.scope==='flag'&&STORE.flags.includes(q.id))))}
function shuffled(list){let a=list.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function timerText(){let s=STATE.session;if(!s||!s.exam)return'';let sec=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function record(q,selected){let old=STORE.history[q.id]||{total:0,correct:0,last:null};old.total++;if(selected===q.answer)old.correct++;old.last=selected===q.answer;STORE.history[q.id]=old;save()}
const FALLBACK=[
 [/\b(leading|lagging|kpi|indicator)\b/i,'Leading indicator mencerminkan proses yang dapat dipengaruhi lebih dini; lagging indicator adalah hasil yang terlihat kemudian. Pastikan definisi pembilang, penyebut, dan waktu ukur.'],
 [/\b(rcm|reliability.centered)\b/i,'RCM memilih kebijakan perawatan berdasarkan fungsi, mode kegagalan, dampak serta konsekuensi terhadap operasi dan keselamatan.'],
 [/\b(fmea|rpn|failure mode)\b/i,'FMEA adalah analisis bottom-up atas failure mode dan efeknya. RPN klasik = Severity × Occurrence × Detection.'],

 [/\b(mttr|repair)\b/i,'MTTR mengukur durasi rata-rata perbaikan; perhatikan apakah waktu tunggu spare part masuk dalam definisi metrik yang digunakan.'],

 [/\b(planner|scheduler|work order|schedule)\b/i,'Planner berfokus menyiapkan pekerjaan masa depan; Scheduler mengalokasikan waktu dan kapasitas; Supervisor mengendalikan eksekusi. Jadwal baik membutuhkan material, kompetensi, akses, dan kesiapan pekerjaan.'],
 [/\b(pareto|ishikawa|fishbone|root cause|rcfa)\b/i,'Pareto membantu memprioritaskan masalah dominan; Fishbone memetakan kemungkinan penyebab; RCFA menguji akar masalah berdasarkan bukti.'],

 [/\b(lubric|oil|viscosity|filter)\b/i,'Kondisi pelumas, kontaminasi, viskositas, partikel aus, dan lokasi sampling perlu dinilai sesuai mode kegagalan yang ingin dideteksi.'],
 [/\b(team|leadership|culture|motivat|train|change)\b/i,'Kepemimpinan dan perubahan memerlukan tujuan bersama, komunikasi dua arah, kompetensi, keterlibatan, serta umpan balik terstruktur.'],
 [/\b(strateg|business|cost|return|budget)\b/i,'Keputusan maintenance harus diselaraskan dengan tujuan bisnis dan risiko, memakai pembandingan nilai, biaya siklus hidup, serta prioritas aset yang relevan.'],
 [/\b(six sigma|lean|kaizen|pdca|continuous)\b/i,'Perbaikan proses mengidentifikasi variasi dan pemborosan, mengukur hasil, melakukan eksperimen serta menjaga perbaikan agar berkelanjutan.'],
 [/\b(vibrat|thermograph|motor|bearing|condition)\b/i,'Pemilihan condition-monitoring perlu sesuai mekanisme kerusakan: vibrasi untuk masalah dinamik, infrared untuk pola suhu, ultrasonic untuk kebocoran atau fenomena berfrekuensi tinggi.']
];
function gulatiText(q){let g=q.gulati;if(!g){return `<div class="booksource muted">Referensi bacaan umum: ${H(q.book_fallback||'Gulati')}. Kunci dokumen pihak ketiga belum seluruhnya diaudit; pembahasan di atas bukan verifikasi dari buku.</div>`}let tag=g.basis==='related'?'Pengayaan terkait (buku tidak memerinci seluruh langkah/rumus)':'Parafrasa konsep dari buku';return `<div class="booksource"><b>📖 Menurut Ramesh Gulati</b><div class="bookref">Maintenance and Reliability Best Practices, ed. 3 • Bab ${H(g.chapter)} • halaman PDF ${H(g.pdf_pages)} • ${H(g.subject)}</div><div>${H(g.insight)}</div><div class="booktag">${H(tag)}. Silakan cek halaman yang dirujuk di e-book milik lo.</div></div>`}

function explanation(q){if(q.explanation&&q.explanation.length>20)return {text:q.explanation,origin:q.validation==='reviewed'?'Pembahasan hasil audit/soal turunan':'Penjelasan dari materi sumber (dapat mengandung kekeliruan)'};let f=FALLBACK.find(([r])=>r.test(q.q));return {text:(f?f[1]:'Pahami tujuan pertanyaan, identifikasi kata kunci, dan eliminasi pilihan yang tidak sesuai konteks maintenance/reliability.'),origin:'Pengayaan konsep oleh aplikasi; PDF hanya menyediakan kunci jawaban'}}
function meta(q){return `<div class="meta"><span class="chip">${H(q.pillar)}</span><span class="chip">${H(q.kind)}</span><span class="chip">${H(q.source)}</span>${q.page?`<span class="chip">hal. ${q.page}</span>`:''}<span class="chip">${q.validation==='reviewed'?'Diperiksa / disusun ulang':'Kunci sumber (belum diaudit)'}</span>${q.needs_review?'<span class="chip" style="color:var(--amber)">⚠ Baca catatan audit</span>':''}</div>`}
function reveal(q,sel,compact=false){let ex=explanation(q);let correct=sel===q.answer;return `<div class="feedback ${correct?'good':'bad'}"><div class="msg">${correct?'✓ Jawaban tepat':'✕ Jawaban perlu diperbaiki'}</div><div class="small muted">${sel==null?'Belum dijawab. ':''}Kunci: <b>${String.fromCharCode(65+q.answer)}. ${H(labelKey(q))}</b></div><div class="explain">${H(ex.text)}</div>${gulatiText(q)}<div class="source-note">${H(ex.origin)} • ${H(q.id)} • ${q.validation==='reviewed'?'Telah diperiksa / dibuat dan dihitung ulang.':'Belum seluruhnya diverifikasi dari referensi independen.'}</div></div>`}
function liveQuestion(){let s=STATE.session;if(!s)return '';if(s.done)return summary();let q=s.items[s.i],selected=s.answers[q.id],checked=!!s.checked[q.id],exam=s.exam,isbook=STORE.bookmarks.includes(q.id),flag=STORE.flags.includes(q.id);return header(exam?'Mock Exam • berlangsung':'Latihan • berlangsung',exam?'Sesi ujian':'Latihan interaktif',`${s.items.length} soal • ${new Set(s.items.map(x=>x.pillar)).size>1 ? "Campuran 5 Pilar" : q.pillar}`)+`<div class="panel qbox"><div class="sectionhead"><div><div class="meta"><span class="pill">Soal ${s.i+1} / ${s.items.length}</span><span class="pill">Terjawab ${Object.keys(s.answers).length}</span></div></div>${exam?`<div class="timer ${Date.now()>s.deadline-300000?'warn':''}" id="live-timer">◷ ${timerText()}</div>`:''}</div><div class="progress"><span style="width:${Math.round(100*(s.i+1)/s.items.length)}%"></span></div>${meta(q)}<div class="question">${H(q.q)}</div><div class="options">${q.options.map((o,i)=>{let cls=(selected===i?' selected':'')+((checked&&!exam&&i===q.answer)?' correct':'')+((checked&&!exam&&i===selected&&i!==q.answer)?' incorrect':'');return `<button class="option ${cls}" data-action="pick" data-index="${i}" ${checked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${H(o)}</span></button>`}).join('')}</div>${checked&&!exam?reveal(q,selected):''}<div class="qfooter"><div class="actions">${btn(isbook?'★ Tersimpan':'☆ Simpan','bookmark','subtle')}${btn(flag?'⚑ Ditandai':'⚐ Kunci ragu','flag','subtle')}</div><div class="actions">${btn('← Kembali','prev','subtle',s.i===0?'disabled':'')}${exam?btn(s.i===s.items.length-1?'Akhiri ujian':'Lanjut →',s.i===s.items.length-1?'finish':'next','primary'):!checked?btn('Periksa jawaban','check','primary',selected==null?'disabled':''):btn(s.i===s.items.length-1?'Lihat hasil':'Soal berikut →',s.i===s.items.length-1?'finish':'next','primary')}${exam&&s.i!==s.items.length-1?btn('Selesaikan ujian','finish','danger'):''}</div></div></div><p class="muted small" style="margin-top:11px">${exam?'Ujian: pilihan jawaban dapat diubah sebelum sesi diakhiri.':'Latihan: jawaban dikoreksi setelah tombol Periksa jawaban ditekan.'}</p>`}
function questionReview(q,answer,idx){let right=answer===q.answer,ex=explanation(q);return `<details class="reviewcard"><summary style="color:${right?'var(--green)':'var(--red)'}">${right?'✓':'✕'} ${idx+1}. ${H(q.q)}</summary><div class="small muted" style="margin-top:11px">Jawaban lo: ${answer==null?'Tidak dijawab':`${String.fromCharCode(65+answer)}. ${H(q.options[answer])}`}</div><div class="answer small">Kunci: ${String.fromCharCode(65+q.answer)}. ${H(labelKey(q))}</div><p>${H(ex.text)}</p><div class="small muted">${H(q.id)} • ${H(ex.origin)}</div></details>`}
function summary(){let s=STATE.session,records=s.items.map(q=>({q,ans:s.answers[q.id]})),right=records.filter(x=>x.ans===x.q.answer).length,wrong=records.filter(x=>x.ans!==x.q.answer).length,percent=Math.round(100*right/records.length);let list=records.filter(x=>STATE.resultReview==='all'||x.ans!==x.q.answer);return header('Hasil sesi',s.exam?'Hasil Mock Exam':'Hasil latihan',`Selesai • ${records.length} soal`)+`<div class="hero results"><div class="eyebrow">Skor sesi</div><div class="score">${percent}%</div><p>${right} benar • ${wrong} salah/terlewat • ${s.exam?'Skor latihan, bukan ambang lulus resmi SMRP.':'Terus ulangi soal yang sulit.'}</p><div class="actions blockspace">${btn('Latihan soal yang salah','retryWrong','primary',wrong?'':'disabled')}${btn('Salin hasil','copyResult','subtle')}${btn('Sesi baru','newSession','subtle')}${btn('Beranda','nav','subtle','data-tab="home"')}</div></div><div class="section" style="margin-bottom:16px"><div class="sectionhead"><h3>Evaluasi 5 Pilar</h3></div><table class="kpiTable"><thead><tr><th>Pilar</th><th>Benar / Soal</th><th>Nilai</th></tr></thead><tbody>${PILLARS.map(p=>{let rows=records.filter(x=>x.q.pillar===p),n=rows.length,good=rows.filter(x=>x.ans===x.q.answer).length;return `<tr><td>${H(p)}</td><td>${good} / ${n}</td><td>${n?Math.round(100*good/n):'—'}${n?'%':''}</td></tr>`}).join('')}</tbody></table><div class="fineprint" style="margin-top:15px">${records.some(x=>x.q.validation!=='reviewed')?'Semua soal dalam versi publik adalah soal latihan orisinal. Skor ini adalah indikator latihan, bukan prediksi kelulusan.':'Seluruh soal sesi ini disusun dan ditinjau dengan referensi buku Gulati; bukan soal resmi.'}</div></div><div class="section"><div class="sectionhead"><h3>Review jawaban</h3><div class="actions">${btn('Yang salah','reviewFilter','subtle','data-value="wrong"')}${btn('Semua','reviewFilter','subtle','data-value="all"')}</div></div><p class="small muted">Klik pertanyaan untuk melihat jawaban, sumber, dan pembahasan.</p>${list.length?list.map((x,i)=>questionReview(x.q,x.ans,i)).join(''):'<p>Seluruh pertanyaan dijawab tepat.</p>'}</div>`}
function flashPage(){let list=FLASH.filter(q=>STATE.flashFilter==='all'||q.pillar===STATE.flashFilter);if(!list.length)return '';STATE.flashIndex=Math.min(STATE.flashIndex,list.length-1);let q=list[STATE.flashIndex],flipped=STATE.flipped,mastered=STORE.mastered.includes(q.id);return header('Kartu hafalan','Flashcards — konsep & rumus','Ketuk kartu untuk melihat jawaban. Tandai jika konsep sudah lo kuasai.')+`<div class="panel" style="max-width:860px"><div class="field"><label>Pilar</label><select data-config="flashFilter"><option value="all">Semua pilar</option>${PILLARS.map(p=>`<option ${p===STATE.flashFilter?'selected':''}>${H(p)}</option>`).join('')}</select></div><div class="meta blockspace"><span class="pill">Kartu ${STATE.flashIndex+1} / ${list.length}</span><span class="pill">${STORE.mastered.filter(id=>list.some(x=>x.id===id)).length} telah dikuasai</span></div><div class="flip blockspace" data-action="flip"><span class="eyebrow">${flipped?'Jawaban':'Pertanyaan'}</span><div class="${flipped?'flippedanswer':'prompt'}">${H(flipped?q.answer:q.q)}</div><span class="small muted">${flipped?'Ketuk lagi untuk melihat pertanyaan':'Ketuk untuk balik kartu'}</span></div>${flipped?`<div class="flashnotes"><b>Penjelasan:</b> ${H(q.explanation)}</div>`:''}<div class="qfooter"><div class="actions">${btn('← Sebelumnya','prevFlash','subtle')}${btn('Berikutnya →','nextFlash','subtle')}</div>${btn(mastered?'✓ Sudah hafal':'Tandai sudah hafal','masterFlash','primary')}</div></div>`}
const FORMS=[
 {key:'availability',title:'Availability',desc:'Perhatikan idle time: penyebutnya adalah waktu yang benar-benar dibutuhkan produksi, bukan otomatis seluruh waktu kalender.',formula:'Availability = Uptime / Required Time × 100%',fields:[['up','Uptime (jam)',688],['req','Required Time (jam)',696]],calc:v=>v.req>0?100*v.up/v.req:null,suffix:'%',precision:2},
 {key:'oee',title:'OEE',desc:'OEE menggabungkan availability, kecepatan, dan kualitas produk baik.',formula:'OEE = A × P × Q / 10.000 (jika input %)',fields:[['a','Availability (%)',90],['p','Performance (%)',85],['q','Quality (%)',98]],calc:v=>v.a*v.p*v.q/10000,suffix:'%',precision:2},
 {key:'mtbf',title:'MTBF',desc:'Gunakan operating time, bukan calendar time bila ada non-operating time.',formula:'MTBF = Total operating hours / Failures',fields:[['hour','Operating time (jam)',1000],['fail','Jumlah failure',8]],calc:v=>v.fail>0?v.hour/v.fail:null,suffix:' jam',precision:2},
 {key:'mttr',title:'MTTR',desc:'Rata-rata durasi repair per kegagalan. Batasan apakah delay ikut dihitung bergantung definisi metrik.',formula:'MTTR = Total repair hours / Repairs',fields:[['hour','Total repair time (jam)',24],['rep','Jumlah repairs',6]],calc:v=>v.rep>0?v.hour/v.rep:null,suffix:' jam',precision:2},
 {key:'rpn',title:'FMEA — RPN',desc:'RPN konvensional: severity, occurrence, detection. Bukan S×O×D×criticality.',formula:'RPN = Severity × Occurrence × Detection',fields:[['s','Severity',8],['o','Occurrence',5],['d','Detection',4]],calc:v=>v.s*v.o*v.d,suffix:'',precision:0},
 {key:'eoq',title:'Economic Order Quantity',desc:'Model EOQ sederhana mengasumsikan demand dan biaya relatif konstan.',formula:'EOQ = √(2 × Demand × Order Cost / Holding Cost)',fields:[['d','Demand / tahun',132],['s','Biaya per pesan',60],['h','Holding cost / unit / tahun',110]],calc:v=>v.h>0?Math.sqrt(2*v.d*v.s/v.h):null,suffix:' unit',precision:2},
 {key:'rop',title:'Reorder Point',desc:'Gunakan unit demand dan lead time yang konsisten.',formula:'ROP = Demand per period × Lead time + Safety stock',fields:[['d','Demand per minggu',100],['lead','Lead time (minggu)',2],['stock','Safety stock',500]],calc:v=>v.d*v.lead+v.stock,suffix:' unit',precision:0},
 {key:'rel',title:'Reliability — series/parallel',desc:'Asumsi komponen independen. R1 dan R2 dimasukkan dalam persen.',formula:'R seri = R1 × R2; R paralel = 1 − (1−R1)(1−R2)',fields:[['r1','R1 (%)',90],['r2','R2 (%)',90]],calc:v=>({series:v.r1*v.r2/100,parallel:100-(100-v.r1)*(100-v.r2)/100}),suffix:'%',precision:2},
];
function formulasPage(){return header('Laboratorium rumus','Kalkulator & pembahasan','Ubah angka pada rumus dan hasil langsung dihitung. Semua perhitungan berlangsung di perangkat lo.')+`<div class="formula-grid">${FORMS.map(f=>`<div class="formula"><div class="sectionhead"><h3>${H(f.title)}</h3><span class="pill">Hitungan</span></div><div class="formulatxt">${H(f.formula)}</div><p>${H(f.desc)}</p><div class="calcfields">${f.fields.map(([k,l,v])=>`<label>${H(l)}<input type="number" inputmode="decimal" step="any" data-calc="${f.key}" data-field="${k}" value="${v}"></label>`).join('')}</div><div class="calcresult" id="res-${f.key}"></div></div>`).join('')}</div><div class="fineprint blockspace"><b>Kesalahan sumber yang diperbaiki:</b> contoh bottle filler 16 jam operasi dan 8 jam downtime dalam 24 jam tanpa quality loss menghasilkan availability/OEE 66,67%, bukan 50%. Idle bukan selalu downtime; tentukan dulu required time sebelum menentukan penyebut.</div>`}
function calcAll(){for(let f of FORMS){let v={};for(let [k] of f.fields){let el=$(`[data-calc="${f.key}"][data-field="${k}"]`);v[k]=Number(el?.value??0)}let n=f.calc(v),el=$('#res-'+f.key);if(!el)continue;let fmt=x=>Number.isFinite(x)?x.toLocaleString('id-ID',{maximumFractionDigits:f.precision,minimumFractionDigits:0})+' '+f.suffix:'Input tidak valid';el.textContent=typeof n==='object'?`Seri: ${fmt(n.series)} | Paralel: ${fmt(n.parallel)}`:n==null||!Number.isFinite(n)?'Input tidak valid':'Hasil: '+fmt(n)}}
function progressPage(){let seen=Object.keys(STORE.history).length,att=totalAttempts(),correct=Object.values(STORE.history).reduce((a,b)=>a+b.correct,0),pct=att?Math.round(correct/att*100):0;return header('Analisis progres','Progres belajar','Data tersimpan lokal di browser ini. Reset browser akan menghapusnya.')+`<div class="grid">${stat('Soal unik sudah dicoba',seen)}${stat('Total jawaban',att)}${stat('Akurasi semua latihan',pct+'%')}${stat('Bookmarked / ditandai',STORE.bookmarks.length+' / '+STORE.flags.length)}</div><div class="twocol blockspace"><div class="panel"><h3>Penguasaan per pilar</h3><table class="kpiTable"><thead><tr><th>Pilar</th><th>Soal</th><th>Akurasi</th></tr></thead><tbody>${PILLARS.map(p=>{let st=statsPillar(p);return `<tr><td>${H(p)}</td><td>${st.seen}</td><td>${st.acc}%</td></tr>`}).join('')}</tbody></table></div><div class="panel"><h3>Riwayat mock exam</h3>${STORE.exams.length?STORE.exams.slice(-8).reverse().map(e=>`<div class="listrow"><span>${H(e.date)} • ${e.count} soal</span><b>${e.score}%</b></div>`).join(''):'<p class="muted small">Belum ada ujian yang diselesaikan.</p>'}<div class="actions blockspace">${btn('Ulangi soal salah','retryGlobal','primary')}${btn('Reset progres','reset','danger')}</div></div></div><div class="panel blockspace"><div class="sectionhead"><h3>Cari soal dalam bank</h3><span class="pill">${MCQ.length} soal</span></div><input class="search" type="search" data-search placeholder="Ketik kata kunci, misalnya availability, planner, RCM..." value="${H(STATE.search)}"><div id="search-results">${searchRows()}</div></div>`}
function searchRows(){let term=STATE.search.toLowerCase().trim();if(!term)return'<p class="small muted">Pencarian mencari pertanyaan dan pilihan jawaban. Klik soal untuk latihan spesifik.</p>';let list=MCQ.filter(q=>(q.q+' '+q.options.join(' ')).toLowerCase().includes(term)).slice(0,24);return `<div class="small muted" style="margin-top:10px">Menampilkan maksimal 24 hasil pertama.</div>${list.map(q=>`<div class="listrow"><span class="wrap" style="max-width:75%"><b class="small">${H(q.q.slice(0,135))}</b><div class="small muted">${H(q.id)} • ${H(q.pillar)}</div></span>${btn('Latih','single','subtle',`data-qid="${H(q.id)}"`)}</div>`).join('')}`}
function render(){persistSession();nav();let s=STATE.session,html='';if((STATE.tab==='study'||STATE.tab==='exam')&&s&&s.exam===(STATE.tab==='exam'))html=liveQuestion();else if(STATE.tab==='home')html=home();else if(STATE.tab==='study')html=setup(false);else if(STATE.tab==='exam')html=setup(true);else if(STATE.tab==='flash')html=flashPage();else if(STATE.tab==='formulas')html=formulasPage();else if(STATE.tab==='progress')html=progressPage();$('#app').innerHTML=html;if(STATE.tab==='formulas')calcAll()}
function finish(){let s=STATE.session;if(!s||s.done)return;if(s.exam){let right=0;for(let q of s.items){let a=s.answers[q.id];if(a===q.answer)right++;record(q,a)}let percent=Math.round(right/s.items.length*100);STORE.exams.push({score:percent,date:new Date().toLocaleDateString('id-ID'),count:s.items.length});if(STORE.exams.length>100)STORE.exams.shift();save()}s.done=true;STATE.resultReview='wrong';render();window.scrollTo(0,0)}
function start(exam,items){let pool=items||filtered(),n=items?items.length:(STATE.config.count==='all'?pool.length:Math.min(Number(STATE.config.count),pool.length));if(!n)return;let list=items||shuffled(pool).slice(0,n);STATE.session={exam,items:list,i:0,answers:{},checked:{},recorded:{},done:false,deadline:Date.now()+(exam&&list.length===110?150*60*1000:list.length*75000)};STATE.tab=exam?'exam':'study';render();window.scrollTo(0,0)}

function balancedSample(n){let per=Math.floor(n/PILLARS.length),out=[];for(let p of PILLARS){let candidates=shuffled(MCQ.filter(q=>q.pillar===p));out.push(...candidates.slice(0,per))}while(out.length<n){let ids=new Set(out.map(x=>x.id)),rest=shuffled(MCQ.filter(q=>!ids.has(q.id)));if(!rest.length)break;out.push(rest[0])}return shuffled(out)}
function diagnosticItems(){return shuffled(MCQ.filter(q=>q.source==='Diagnostic Final — Gulati (25 soal)'))}
function fullItems(){let originals=MCQ.filter(q=>q.source==='Diagnostic Final — Gulati (25 soal)'||q.source==='Predictive BoK — soal orisinal (85)');return shuffled(originals)}
function onClick(e){let t=e.target.closest('[data-action]');if(!t)return;let a=t.dataset.action,s=STATE.session;
 if(a==='nav'){STATE.tab=t.dataset.tab; if(s&&s.done)STATE.session=null; render();window.scrollTo(0,0);return}
 if(a==='choosePillar'){STATE.config.pillar=t.dataset.pillar;STATE.tab='study';STATE.session=null;render();window.scrollTo(0,0);return}
 if(a==='quickDiagnostic'){STATE.session=null;start(true,diagnosticItems());return}
 if(a==='quickFull'){STATE.session=null;start(true,fullItems());return}
 if(a==='start'){start(t.dataset.exam==='1');return}
 if(a==='pick'&&s&&!s.done){let q=s.items[s.i];if(!s.checked[q.id]){s.answers[q.id]=Number(t.dataset.index);render()}return}
 if(a==='check'&&s&&!s.done&&!s.exam){let q=s.items[s.i];if(s.answers[q.id]==null)return;s.checked[q.id]=true;if(!s.recorded[q.id]){record(q,s.answers[q.id]);s.recorded[q.id]=true}render();return}
 if(a==='next'&&s&&!s.done){if(s.i<s.items.length-1)s.i++;render();window.scrollTo(0,0);return}
 if(a==='prev'&&s&&!s.done){s.i=Math.max(0,s.i-1);render();window.scrollTo(0,0);return}
 if(a==='finish'){if(s?.exam&&!s.done&&s.items.some(q=>s.answers[q.id]==null)&&!confirm('Masih ada soal yang belum dijawab. Akhiri ujian dan hitung nilainya sekarang?'))return;finish();return}
 if(a==='bookmark'&&s){let id=s.items[s.i].id;STORE.bookmarks=STORE.bookmarks.includes(id)?STORE.bookmarks.filter(x=>x!==id):[...STORE.bookmarks,id];save();render();return}
 if(a==='flag'&&s){let id=s.items[s.i].id;STORE.flags=STORE.flags.includes(id)?STORE.flags.filter(x=>x!==id):[...STORE.flags,id];save();render();return}
 if(a==='reviewFilter'){STATE.resultReview=t.dataset.value;render();return}
 if(a==='retryWrong'&&s){let subset=s.items.filter(q=>s.answers[q.id]!==q.answer);STATE.session=null;start(false,subset);return}
 if(a==='newSession'){STATE.session=null;render();return}
 if(a==='retryGlobal'){let subset=MCQ.filter(q=>STORE.history[q.id]?.last===false);if(!subset.length){alert('Belum ada soal salah untuk diulang.');return}STATE.session=null;start(false,shuffled(subset).slice(0,Math.min(30,subset.length)));return}
 if(a==='copyResult'&&s){let r=s.items.filter(q=>s.answers[q.id]===q.answer).length,wrong=s.items.filter(q=>s.answers[q.id]!==q.answer).map(q=>q.id),text=`CMRP TRAINER • ${r}/${s.items.length} benar (${Math.round(100*r/s.items.length)}%)\nPerlu dipelajari: ${wrong.join(', ')||'-'}\n`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>alert('Hasil disalin. Tempel ke chat untuk dibahas bersama.')).catch(()=>prompt('Salin hasil:',text))}else prompt('Salin hasil:',text);return}
 if(a==='single'){let q=MCQ.find(x=>x.id===t.dataset.qid);if(q)start(false,[q]);return}
 if(a==='flip'){STATE.flipped=!STATE.flipped;render();return}
 if(a==='nextFlash'||a==='prevFlash'){let list=FLASH.filter(q=>STATE.flashFilter==='all'||q.pillar===STATE.flashFilter);STATE.flashIndex=(STATE.flashIndex+(a==='nextFlash'?1:-1)+list.length)%list.length;STATE.flipped=false;render();return}
 if(a==='masterFlash'){let list=FLASH.filter(q=>STATE.flashFilter==='all'||q.pillar===STATE.flashFilter),id=list[STATE.flashIndex]?.id;if(!id)return;STORE.mastered=STORE.mastered.includes(id)?STORE.mastered.filter(x=>x!==id):[...STORE.mastered,id];save();render();return}
